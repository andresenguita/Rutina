<title>Semana Base</title>
<style>
:root{
  --paper:#E6F1F9; --card:#FFFFFF; --soft:#EFF7FC;
  --ink:#0F2331; --ink-2:#4B6575; --ink-3:#7994A6;
  --line:#C9E0EF;
  --sport:#0F7BA8; --cook:#A8660F; --shop:#4A50A0; --clean:#8A4A86; --rest:#5E7280;
  --accent:#0F7BA8; --accent-soft:#CFE9F8; --on-accent:#FFFFFF; --sky:#4FB4DF;
  --c-hoy:#0F7BA8; --c-tareas:#0E7A62; --c-agenda:#4A50A0;
  --c-semana:#8A4A86; --c-compra:#A0641A; --c-casa:#A34A52;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* color propio de cada pestaña */
body[data-view="hoy"]   {--accent:#0F7BA8; --accent-soft:#CFE9F8; --sky:#4FB4DF}
body[data-view="tareas"]{--accent:#0E7A62; --accent-soft:#CFEAE2; --sky:#35B394}
body[data-view="agenda"]{--accent:#4A50A0; --accent-soft:#DCDEF6; --sky:#767CD0}
body[data-view="semana"]{--accent:#8A4A86; --accent-soft:#F0DDEF; --sky:#B071AC}
body[data-view="compra"]{--accent:#A0641A; --accent-soft:#F7E7D0; --sky:#D08F3A}
body[data-view="casa"]  {--accent:#A34A52; --accent-soft:#F7DEE0; --sky:#CE7A82}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1620; --card:#14212B; --soft:#1A2935;
    --ink:#E6F0F6; --ink-2:#A0B6C3; --ink-3:#7A909D;
    --line:#243542;
    --sport:#6FCFF2; --cook:#E3A94A; --shop:#93A6EE; --clean:#CE94CB; --rest:#8DA3AE;
    --accent:#6FCFF2; --accent-soft:#13323F; --on-accent:#071C24; --sky:#6FCFF2;
    --c-hoy:#6FCFF2; --c-tareas:#56D3B2; --c-agenda:#A2AAF7;
    --c-semana:#DCA0D8; --c-compra:#E7AE54; --c-casa:#F2969E;
  }
  :root:not([data-theme="light"]) body[data-view="hoy"]   {--accent:#6FCFF2; --accent-soft:#13323F; --sky:#6FCFF2}
  :root:not([data-theme="light"]) body[data-view="tareas"]{--accent:#56D3B2; --accent-soft:#10332C; --sky:#56D3B2}
  :root:not([data-theme="light"]) body[data-view="agenda"]{--accent:#A2AAF7; --accent-soft:#1E2140; --sky:#A2AAF7}
  :root:not([data-theme="light"]) body[data-view="semana"]{--accent:#DCA0D8; --accent-soft:#341C33; --sky:#DCA0D8}
  :root:not([data-theme="light"]) body[data-view="compra"]{--accent:#E7AE54; --accent-soft:#35270F; --sky:#E7AE54}
  :root:not([data-theme="light"]) body[data-view="casa"]  {--accent:#F2969E; --accent-soft:#3A1D20; --sky:#F2969E}
}
:root[data-theme="dark"]{
  --paper:#0B1620; --card:#14212B; --soft:#1A2935;
  --ink:#E6F0F6; --ink-2:#A0B6C3; --ink-3:#7A909D;
  --line:#243542;
  --sport:#6FCFF2; --cook:#E3A94A; --shop:#93A6EE; --clean:#CE94CB; --rest:#8DA3AE;
  --accent:#6FCFF2; --accent-soft:#13323F; --on-accent:#071C24; --sky:#6FCFF2;
  --c-hoy:#6FCFF2; --c-tareas:#56D3B2; --c-agenda:#A2AAF7;
  --c-semana:#DCA0D8; --c-compra:#E7AE54; --c-casa:#F2969E;
}
:root[data-theme="dark"] body[data-view="hoy"]   {--accent:#6FCFF2; --accent-soft:#13323F; --sky:#6FCFF2}
:root[data-theme="dark"] body[data-view="tareas"]{--accent:#56D3B2; --accent-soft:#10332C; --sky:#56D3B2}
:root[data-theme="dark"] body[data-view="agenda"]{--accent:#A2AAF7; --accent-soft:#1E2140; --sky:#A2AAF7}
:root[data-theme="dark"] body[data-view="semana"]{--accent:#DCA0D8; --accent-soft:#341C33; --sky:#DCA0D8}
:root[data-theme="dark"] body[data-view="compra"]{--accent:#E7AE54; --accent-soft:#35270F; --sky:#E7AE54}
:root[data-theme="dark"] body[data-view="casa"]  {--accent:#F2969E; --accent-soft:#3A1D20; --sky:#F2969E}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f);
  font-size:16px; line-height:1.45; margin:0;
  padding-inline:16px; padding-block:0 48px;
  -webkit-text-size-adjust:100%;
}
.app{max-width:520px; margin:0 auto}

header.top{padding-block:18px 8px; display:flex; align-items:flex-end;
           justify-content:space-between; gap:12px}
h1{font-size:28px; font-weight:700; line-height:1.05; margin:0; letter-spacing:-.02em}
.sub{font-size:13px; color:var(--ink-3); margin-top:3px}
.save{font-size:11px; color:var(--ink-3); white-space:nowrap; padding-bottom:4px}
.save.ok{color:var(--accent)}

.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
      background:var(--paper); padding-block:6px 10px;
      display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.tabs button{border:1px solid var(--line); background:var(--card); color:var(--ink-2);
             border-radius:11px; padding:8px 4px 9px; font-size:12.5px; font-weight:600;
             font-family:var(--f); cursor:pointer; line-height:1.2;
             display:flex; flex-direction:column; align-items:center; gap:4px;
             -webkit-tap-highlight-color:transparent}
.tabs button i{width:7px; height:7px; border-radius:50%; background:var(--tc); display:block}
.tabs button[aria-pressed="true"]{background:var(--tc); border-color:var(--tc); color:var(--on-accent)}
.tabs button[aria-pressed="true"] i{background:var(--on-accent); opacity:.7}
.tabs button[data-v="hoy"]{--tc:var(--c-hoy)}
.tabs button[data-v="tareas"]{--tc:var(--c-tareas)}
.tabs button[data-v="agenda"]{--tc:var(--c-agenda)}
.tabs button[data-v="semana"]{--tc:var(--c-semana)}
.tabs button[data-v="compra"]{--tc:var(--c-compra)}
.tabs button[data-v="casa"]{--tc:var(--c-casa)}

h2{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
   color:var(--ink-3); margin:22px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}

.meal{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line)}
.meal:first-child{border-top:0; padding-top:0}
.meal:last-child{padding-bottom:0}
.meal b{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
        width:74px; flex:none; font-weight:700; padding-top:5px}
.meal span{flex:1; min-width:0}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:500;
      border:1px solid currentColor; border-radius:9px; padding:5px 8px; color:var(--rest)}
.chip .ed{color:var(--ink)}
.c-sport{color:var(--sport)} .c-cook{color:var(--cook)} .c-shop{color:var(--shop)}
.c-clean{color:var(--clean)} .c-rest{color:var(--rest)}

.ed{display:inline-block; border-radius:5px; padding:0 2px; margin:0 -2px; outline:none;
    min-width:14px; word-break:break-word}
.ed:focus{background:var(--accent-soft); box-shadow:inset 0 -2px 0 var(--accent)}

ul{list-style:none; margin:0; padding:0}

.row{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line);
       flex-wrap:wrap}
.row:first-child{border-top:0}
.dia + .row{border-top:0}
.box{flex:none; width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line);
     background:var(--soft); padding:0; cursor:pointer; color:transparent;
     display:grid; place-items:center; font-size:15px; line-height:1;
     -webkit-tap-highlight-color:transparent}

.done .box{background:var(--sky); border-color:var(--sky); color:#fff}
.done .txt{color:var(--ink-3); text-decoration:line-through}
.txt{flex:1; min-width:0}
.x{border:0; background:transparent; color:var(--ink-3); font-size:22px; line-height:1;
   padding:2px 6px; cursor:pointer; flex:none; border-radius:6px; font-family:var(--f)}
.hour{color:var(--ink-2); width:52px; flex:none; font-variant-numeric:tabular-nums}

.bell{border:0; background:transparent; color:var(--accent); cursor:pointer; flex:none;
      padding:4px; border-radius:7px; display:grid; place-items:center;
      -webkit-tap-highlight-color:transparent}
.bell svg{display:block}
.bell[disabled]{color:var(--ink-3); opacity:.4; cursor:default}
.bell.on{color:var(--sky)}

.cuando{flex-basis:100%; display:flex; gap:6px; align-items:center; padding:2px 0 0 36px}
.cuando input{border:1px solid var(--line); background:var(--soft); color:var(--ink);
              border-radius:8px; padding:6px 8px; font-size:13px; font-family:var(--f)}
.cuando input:focus{outline:none; border-color:var(--accent)}
.cuando .quitar{border:0; background:transparent; color:var(--ink-3); font-size:12px;
                cursor:pointer; font-family:var(--f); text-decoration:underline}
.marca{font-size:12px; color:var(--accent); font-variant-numeric:tabular-nums; flex:none}

.wrow{display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow.now{margin-inline:-14px; padding-inline:14px; background:var(--accent-soft);
          border-radius:10px; border-top-color:transparent; box-shadow:inset 3px 0 0 var(--sky)}
.wk{font-weight:700; font-size:15px; width:22px; flex:none; color:var(--ink-3); padding-top:1px}
.wrow.now .wk{color:var(--accent)}
.wbody{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.wmeal{font-size:14px; color:var(--ink-2)}
.wmeal i{font-style:normal; color:var(--ink-3); font-size:11px; letter-spacing:.06em;
         text-transform:uppercase; margin-right:6px}

.btn{border:1px dashed var(--line); background:transparent; color:var(--ink-3);
     border-radius:10px; padding:11px 12px; font-size:14px; cursor:pointer;
     font-family:var(--f); width:100%; margin-top:10px}
.mini{border:1px solid var(--line); background:transparent; color:var(--ink-2);
      border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer;
      font-family:var(--f); margin:10px 6px 0 0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.seg{display:flex; gap:6px; margin-bottom:10px}
.seg button{flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink-2);
            border-radius:11px; padding:10px 6px; font-size:13px; font-weight:600;

<script>
(function(){

    {t:"Lavar sábanas",f:"Quincenal"},{t:"Limpiar nevera",f:"Quincenal"},

         {t:"Contramuslos al horno"},{t:"Cortar verdura de la semana"},{t:"Legumbre en remojo"}],
  ideas:[
    {k:"platos",n:"Comidas y cenas",items:[
      {t:"Arroz + cebolla + champis + huevos"},{t:"Pasta + pollo + brócoli + cebolla"},
      {t:"Garbanzos + pimientos + cebolla + huevos + atún + aceitunas"},
      {t:"Pasta + tomate + atún + cebolla + ajo"},{t:"Arroz + contramuslos + crema"},
      {t:"Arroz + pescado + crema"},{t:"Fajitas + espinacas + carne + queso + tomate"},
      {t:"Lentejas + zanahoria + puerro"},{t:"Salteado de arroz + verdura + huevo"}]},
    {k:"cremas",n:"Cremas",items:[
      {t:"Calabaza + cebolla + zanahoria"},{t:"Calabacín + cebolla"},
      {t:"Calabaza + zanahoria + puerro"},{t:"Calabacín + puerro + espinacas"}]},
    {k:"desayunos",n:"Desayunos",items:[
      {t:"Yogur + arándanos + plátano + nueces + avena + chocolate"},
      {t:"Tostadas + jamón + tomate"},{t:"Tostadas + huevo + aguacate"}]},
    {k:"frutas",n:"Frutas",items:[

      {t:"Mandarinas"},{t:"Kiwis"},{t:"Nectarinas"}]}

var BASE_DIA=[{h:"07:30",t:"Desayunar"},{h:"14:30",t:"Comer"},
               {h:"20:00",t:"Cenar"},{h:"22:30",t:"Acostarse"}];
var LS_KEY="semanaBase.v1";
var IS_ARTIFACT=!!(window.claude && typeof window.claude.use==="function");
var state=JSON.parse(JSON.stringify(DEFAULTS));
var view="hoy", shopTab=0;
var docRef=null, timer=null, saving=false, dirty=false;
var todayIdx=(new Date().getDay()+6)%7;

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function get(p){var k=p.split("."),o=state,i;for(i=0;i<k.length;i++)o=o[k[i]];return o;}
function put(p,v){var k=p.split("."),l=k.pop(),o=state,i;for(i=0;i<k.length;i++)o=o[k[i]];o[l]=v;}
function ed(p,v){return '<span class="ed" contenteditable="true" data-p="'+p+'">'+esc(v)+'</span>';}
function del(p,i){return '<button class="x" data-a="del" data-p="'+p+'" data-i="'+i+'" aria-label="Quitar">&times;</button>';}
function chk(p,on){return '<button class="box" data-a="toggle" data-p="'+p+'" aria-pressed="'+(!!on)+'">&#10003;</button>';}

function mins(s){
  var m=String(s==null?"":s).match(/(\d{1,2})\D*(\d{1,2})?/);
  if(!m) return 0;
  var h=Math.min(23,parseInt(m[1],10)||0);
  var mi=Math.min(59,parseInt(m[2]||"0",10)||0);
  return h*60+mi;
}
function normHour(s){
  var v=mins(s);
  return pad2(Math.floor(v/60))+":"+pad2(v%60);
}
function sortToday(){ state.today.sort(function(a,b){ return mins(a.h)-mins(b.h); }); }

/* ===================== AVISOS =====================
   Dos mecanismos distintos, porque una web no puede despertarse sola:
   1) Alarmas en el calendario del móvil  -> funcionan con la app cerrada.
   2) Avisos del sistema desde la propia app -> solo con la app abierta. */

var HORA_RESUMEN="21:00";
var NOTI_KEY="semanaBase.noti";

function notiVistos(){
  try{ return JSON.parse(localStorage.getItem(NOTI_KEY)||"{}"); }catch(e){ return {}; }
}
function marcaVisto(k){
  var hoy=isoDe(new Date()), v=notiVistos(), limpio={};
  Object.keys(v).forEach(function(x){ if(x.indexOf(hoy)===0) limpio[x]=1; });
  limpio[k]=1;
  try{ localStorage.setItem(NOTI_KEY, JSON.stringify(limpio)); }catch(e){}
}
function puedeAvisar(){ return ("Notification" in window) && Notification.permission==="granted"; }
function lanzar(titulo,cuerpo){
  var opts={body:cuerpo, icon:"icon.png", badge:"icon.png", tag:titulo, renotify:false};
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(function(reg){
      return reg.showNotification(titulo,opts);
    }).catch(function(){ try{ new Notification(titulo,opts); }catch(e){} });
  }else{
    try{ new Notification(titulo,opts); }catch(e){}
  }
}
function resumenManana(){
  var man=enDias(1);
  var lista=agendaItems().filter(function(o){ return o.f===man; });
  if(!lista.length) return "Mañana no tienes nada anotado.";
  return lista.map(function(o){ return o.h+"  "+o.t; }).join("\n");
}
function revisarAvisos(){
  if(!puedeAvisar()) return;
  var now=new Date(), hoy=isoDe(now), m=now.getHours()*60+now.getMinutes();
  var vistos=notiVistos();
  var filas = diaHorario()===hoy
    ? filasHorario()
    : agendaItems().filter(function(o){ return o.f===hoy; });
  filas.forEach(function(r){
    if(!r.t) return;
    var t=mins(r.h);
    if(m>=t && m<t+3){
      var k=hoy+"|h|"+normHour(r.h)+"|"+r.t;
      if(!vistos[k]){ lanzar(r.t, "Toca ahora · "+normHour(r.h)); marcaVisto(k); }
    }
  });
  var t21=mins(HORA_RESUMEN);
  if(m>=t21 && m<t21+3){
    var k2=hoy+"|resumen";
    if(!vistos[k2]){ lanzar("Mañana", resumenManana()); marcaVisto(k2); }
  }
}
function pedirPermiso(){
  if(!("Notification" in window)){ window.alert("Este navegador no tiene avisos."); return; }
  Notification.requestPermission().then(function(){ render(); });
}

/* --- alarmas recurrentes para el calendario del móvil --- */
function escICS(s){ return String(s).replace(/([,;\\])/g,"\\$1").replace(/\r?\n/g,"\\n"); }
function sello(d){
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"T"+
         pad2(d.getHours())+pad2(d.getMinutes())+"00";
}
function bloqueEvento(titulo,cuando,minutos){
  var fin=new Date(cuando.getTime()+(minutos||15)*60000);
  var uid=Date.now()+"-"+Math.random().toString(36).slice(2)+"@semanabase";
  var L=["BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+sello(new Date()),
         "DTSTART:"+sello(cuando),"DTEND:"+sello(fin),
         "RRULE:FREQ=DAILY","SUMMARY:"+escICS(titulo)];
  if(/^https?:/.test(location.href)) L.push("URL:"+location.href.split("#")[0]);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escICS(titulo),
         "TRIGGER:PT0M","END:VALARM","END:VEVENT");
  return L;
}
function hoyALas(hhmm){
  var m=mins(hhmm), ahora=new Date();
  var d=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate(),Math.floor(m/60),m%60,0);
  if(d.getTime()<Date.now()) d.setDate(d.getDate()+1);
  return d;
}
function bajarICS(lineas,nombre){
  var txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Semana Base//ES","CALSCALE:GREGORIAN"]
          .concat(lineas).concat(["END:VCALENDAR"]).join("\r\n");
  var blob=new Blob([txt],{type:"text/calendar;charset=utf-8"});
  try{
    if(window.File && navigator.canShare){
      var file=new File([blob],nombre,{type:"text/calendar"});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).catch(function(){});
        return;
      }
    }
  }catch(e){}
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },800);
  }catch(e){ window.alert("Este navegador no deja crear el archivo."); }
}
function programarHorario(){
  var L=[];
  state.today.forEach(function(r){
    if(r.t) L=L.concat(bloqueEvento(r.t, hoyALas(r.h), 15));
  });
  if(!L.length){ window.alert("No hay nada en el horario."); return; }
  bajarICS(L,"horario-diario.ics");
}
function programarResumen(){
  bajarICS(bloqueEvento("Repasar la agenda de mañana", hoyALas(HORA_RESUMEN), 10),
           "repaso-noche.ics");
}

function fechaLarga(iso){
  var p=String(iso||"").split("-");
  if(p.length!==3) return "";
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var hoy=isoDe(new Date());
  if(iso===hoy) return "Hoy";
  if(iso===enDias(1)) return "Mañana";
  var s=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function calendario(attrs,activo){
  return '<button class="bell'+(activo?" on":"")+'" '+attrs+
    ' aria-label="Poner fecha y hora"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" '+
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
    '<rect x="3" y="5" width="18" height="16" rx="3"/>'+
    '<path d="M3 10h18M8 3v3M16 3v3"/></svg></button>';
}

function status(k,t){var e=document.getElementById("save");e.className="save"+(k?" "+k:"");e.textContent=t;}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); return true; }catch(e){ return false; }
}
function save(){
  saveLocal();
  if(docRef){
    dirty=true; status("","Guardando…");
    clearTimeout(timer); timer=setTimeout(flush,600);
  }else{ status("ok","Guardado"); }
}
function flush(){
  if(!docRef||saving||!dirty)return;
  saving=true; dirty=false;
  docRef.set({v:1,state:state}).then(function(){
    saving=false; status("ok","Guardado"); if(dirty)flush();
  }).catch(function(){ saving=false; status("","Guardado en el móvil"); });
}

/* ---------------- vistas ---------------- */
function mealRow(label,path,val){
  return '<div class="meal"><b>'+label+'</b><span>'+ed(path,val)+'</span></div>';
}

function vHoy(){
  var d=state.days[todayIdx], h="", j;
  h+='<div class="card"><div class="chips">';
  for(j=0;j<d.acts.length;j++){
    h+='<span class="chip c-'+d.acts[j].c+'">'+ed("days."+todayIdx+".acts."+j+".t",d.acts[j].t)+
       del("days."+todayIdx+".acts",j)+'</span>';
  }
  h+='</div><button class="btn" data-a="add-act">+ Añadir actividad</button></div>';

  var mañana = diaHorario()!==isoDe(new Date());
  var filas = filasHorario();
  h+='<h2>Horario'+(mañana?' · mañana':'')+'</h2><div class="card"><ul>';
  filas.forEach(function(r){
    if(r.tipo==="base"){
      h+='<li class="row"><span class="hour">'+ed("today."+r.i+".h",r.h)+'</span>'+
         '<span class="txt">'+ed("today."+r.i+".t",r.t)+'</span>'+del("today",r.i)+'</li>';
    }else if(r.tipo==="ev"){
      h+='<li class="row"><span class="hour">'+ed("eventos."+r.i+".h",r.h)+'</span>'+
         '<i class="pip pip-ev"></i>'+
         '<span class="txt">'+ed("eventos."+r.i+".t",r.t)+'</span></li>';
    }else{
      var t=state.todos[r.i];
      h+='<li class="row esTarea'+(t.done?" done":"")+'">'+
         '<span class="hour">'+ed("todos."+r.i+".h",r.h)+'</span>'+
         chk("todos."+r.i+".done",t.done)+
         '<span class="txt">'+ed("todos."+r.i+".t",r.t)+'</span></li>';
    }
  });
  h+='</ul><button class="btn" data-a="add-today">+ Añadir hora</button>'+
     '<button class="mini" data-a="fin-dia">Fin del día</button>';
  if(filas.some(function(r){ return r.tipo!=="base"; })){
    h+='<p class="hint">Lo que lleva punto o casilla viene de la Agenda. Se quita desde allí.</p>';
  }
  h+='</div>';

  h+='<h2>Menú</h2><div class="card">'+
     mealRow("Desayuno","days."+todayIdx+".meals.d",d.meals.d)+
     mealRow("Comida","days."+todayIdx+".meals.c",d.meals.c)+
     mealRow("Cena","days."+todayIdx+".meals.e",d.meals.e)+'</div>';
  return h;
}

/* El horario pasa a ser el de mañana en cuanto cierras el día. */
function diaHorario(){
  return state.finDia===isoDe(new Date()) ? enDias(1) : isoDe(new Date());
}
/* Junta las horas fijas del día con lo que haya en la agenda para ese día. */
function filasHorario(){
  var dia=diaHorario(), out=[];
  state.today.forEach(function(r,i){ out.push({tipo:"base", i:i, h:normHour(r.h), t:r.t}); });
  agendaItems().forEach(function(o){ if(o.f===dia) out.push(o); });
  out.sort(function(a,b){ return mins(a.h)-mins(b.h); });
  return out;
}

function vTareas(){
  var pend=[], hech=[];
  state.todos.forEach(function(t,i){ (t.done?hech:pend).push(i); });
  var h='<div class="nueva">'+
        '<input id="nueva-tarea" type="text" placeholder="Nueva tarea" '+
        'autocomplete="off" autocapitalize="sentences" enterkeyhint="done">'+
        '<button data-a="add-todo">Añadir</button></div>';
  h+='<div class="card">';
  if(!state.todos.length){
    h+='<div class="vacio">Sin tareas. Escribe una arriba.</div>';
  }else{
    h+='<ul>'+pend.map(fila).join("")+'</ul>';
    if(!pend.length) h+='<div class="vacio">Nada pendiente. Bien ahí.</div>';
    if(hech.length){
      h+='<div class="sep">Hechas · '+hech.length+'</div><ul>'+hech.map(fila).join("")+'</ul>'+
         '<button class="mini" data-a="clear-todos">Borrar las hechas</button>';
    }
  }
  h+='</div>';
  return h;

  function fila(i){
    var t=state.todos[i];
    var s='<li class="row'+(t.done?" done":"")+'">'+chk("todos."+i+".done",t.done)+
      '<span class="txt">'+ed("todos."+i+".t",t.t)+'</span>';
    if(t.f && !t.o) s+='<span class="marca">'+esc(cortaFecha(t.f)+" · "+normHour(t.h||"09:00"))+'</span>';
    s+=calendario('data-a="abrir-cuando" data-i="'+i+'"', !!t.f)+del("todos",i);
    if(t.o){
      s+='<div class="cuando">'+
         '<input type="date" data-p="todos.'+i+'.f" value="'+esc(t.f||"")+'">'+
         '<input type="time" data-p="todos.'+i+'.h" value="'+esc(normHour(t.h||"09:00"))+'">'+
         (t.f?'<button class="quitar" data-a="quitar-fecha" data-i="'+i+'">quitar fecha</button>':"")+
         '</div>';
    }
    s+='</li>';
    return s;
  }
}
function cortaFecha(iso){
  var p=String(iso||"").split("-");
  return p.length===3 ? p[2]+"/"+p[1] : "";
}

/* La agenda junta los eventos con las tareas que tienen fecha. */
function agendaItems(){
  var lista=[];
  state.eventos.forEach(function(e,i){
    if(e.f) lista.push({tipo:"ev", i:i, f:e.f, h:normHour(e.h||"00:00"), t:e.t});
  });
  state.todos.forEach(function(t,i){
    if(t.f && !t.done) lista.push({tipo:"td", i:i, f:t.f, h:normHour(t.h||"09:00"), t:t.t});
  });
  lista.sort(function(a,b){
    var ka=a.f+"T"+a.h, kb=b.f+"T"+b.h;
    return ka<kb?-1:(ka>kb?1:0);
  });
  return lista;
}

function vAgenda(){
  var hoy=isoDe(new Date());
  var todo=agendaItems();
  var futuros=todo.filter(function(o){ return o.f>=hoy; });
  var pasados=todo.filter(function(o){ return o.f<hoy; });
  var sinFecha=state.todos.filter(function(t){ return !t.f && !t.done; }).length;

  var h='<div class="nueva">'+
        '<input id="nuevo-evento" type="text" placeholder="Nuevo evento" '+
        'autocomplete="off" autocapitalize="sentences" enterkeyhint="done">'+
        '</div><div class="fila2">'+
        '<input id="nuevo-fecha" type="date" value="'+hoy+'">'+
        '<input id="nuevo-hora" type="time" value="19:00">'+
        '</div><button class="ancho" data-a="add-evento">Añadir evento</button>';

  var man=todo.filter(function(o){ return o.f===enDias(1); });
  h+='<div class="manana"><b>Mañana</b>'+
     (man.length
       ? '<ul>'+man.map(function(o){
           return '<li><span>'+esc(o.h)+'</span>'+esc(o.t)+'</li>'; }).join("")+'</ul>'
       : '<p>Nada anotado.</p>')+'</div>';

  h+='<div class="card">';
  if(!futuros.length && !pasados.length){
    h+='<div class="vacio">Nada en la agenda todavía.</div>';
  }else{
    if(!futuros.length) h+='<div class="vacio">Nada por delante.</div>';
    var dia="";
    futuros.forEach(function(o){
      if(o.f!==dia){ dia=o.f; h+='<div class="dia">'+esc(fechaLarga(o.f))+'</div>'; }
      h+=filaAg(o);
    });
    if(pasados.length){
      h+='<div class="sep">Pasados · '+pasados.length+'</div>';
      pasados.forEach(function(o){ h+=filaAg(o,true); });
      h+='<button class="mini" data-a="clear-eventos">Borrar eventos pasados</button>';
    }
  }
  h+='</div>';
  h+='<div class="leyenda"><span><i class="pip pip-ev"></i>Evento</span>'+
     '<span><i class="pip pip-td"></i>Tarea con fecha</span></div>';
  if(sinFecha){
    h+='<p class="hint">Tienes '+sinFecha+(sinFecha===1?' tarea sin fecha':' tareas sin fecha')+
       '. Ponles día y hora con el icono de calendario en la pestaña Tareas y aparecen aquí.</p>';
  }
  h+='<p class="hint">En las tareas, la × solo les quita la fecha: la tarea sigue en su pestaña.</p>';
  return h;

  function filaAg(o,viejo){
    var gris=viejo?' style="color:var(--ink-3)"':'';
    if(o.tipo==="ev"){
      return '<div class="row">'+
        '<span class="hour">'+ed("eventos."+o.i+".h",o.h)+'</span>'+
        '<i class="pip pip-ev"></i>'+
        '<span class="txt"'+gris+'>'+ed("eventos."+o.i+".t",o.t)+'</span>'+
        del("eventos",o.i)+'</div>';
    }
    var t=state.todos[o.i];
    return '<div class="row esTarea'+(t.done?" done":"")+'">'+
      '<span class="hour">'+ed("todos."+o.i+".h",o.h)+'</span>'+
      chk("todos."+o.i+".done",t.done)+
      '<span class="txt"'+gris+'>'+ed("todos."+o.i+".t",o.t)+'</span>'+
      '<button class="x" data-a="quitar-fecha" data-i="'+o.i+'" '+
      'aria-label="Quitar de la agenda">&times;</button></div>';
  }
}

function vSemana(){
  var h='<div class="card">';
  state.days.forEach(function(d,i){
    h+='<div class="wrow'+(i===todayIdx?" now":"")+'"><div class="wk">'+esc(d.k)+'</div><div class="wbody"><div class="chips">';
    d.acts.forEach(function(a,j){
      h+='<span class="chip c-'+a.c+'">'+ed("days."+i+".acts."+j+".t",a.t)+'</span>';
    });
    h+='</div><div class="wmeal"><i>Com</i>'+ed("days."+i+".meals.c",d.meals.c)+'</div>'+
       '<div class="wmeal"><i>Cen</i>'+ed("days."+i+".meals.e",d.meals.e)+'</div></div></div>';
  });
  h+='</div>';
  state.ideas.forEach(function(G,gi){
    h+='<h2>'+esc(G.n)+'</h2><div class="card">';
    G.items.forEach(function(it,i){
      h+='<div class="tagline"><span>'+ed("ideas."+gi+".items."+i+".t",it.t)+'</span>'+
         del("ideas."+gi+".items",i)+'</div>';
    });
    h+='<button class="btn" data-a="add" data-p="ideas.'+gi+'.items">+ Añadir</button></div>';
  });
  return h;
}

function vCompra(){
  var h='<div class="seg">';
  state.lists.forEach(function(L,i){
    var n=L.items.filter(function(x){return x.done;}).length;
    h+='<button data-a="tab" data-i="'+i+'" aria-pressed="'+(i===shopTab)+'">'+esc(L.n)+
       '<small>'+esc(L.day)+' · '+n+'/'+L.items.length+'</small></button>';
  });
  h+='</div>';
  var L=state.lists[shopTab], p="lists."+shopTab+".items";
  h+='<div class="card"><ul>';
  L.items.forEach(function(it,i){
    h+='<li class="row'+(it.done?" done":"")+'">'+chk(p+"."+i+".done",it.done)+
       '<span class="txt">'+ed(p+"."+i+".t",it.t)+'</span>'+del(p,i)+'</li>';
  });
  h+='</ul><button class="btn" data-a="add" data-p="'+p+'">+ Añadir</button>'+
     '<button class="mini" data-a="uncheck" data-p="'+p+'">Desmarcar todo</button></div>';
  return h;
}

function vCasa(){
  var h="", groups=["Semanal","Quincenal","Mensual"];
  groups.forEach(function(g){
    var idx=[];
    state.clean.forEach(function(c,i){ if(c.f===g) idx.push(i); });
    var n=idx.filter(function(i){return state.clean[i].done;}).length;
    h+='<h2>'+g+' · '+n+'/'+idx.length+'</h2><div class="card"><ul>';
    idx.forEach(function(i){
      var c=state.clean[i];
      h+='<li class="row'+(c.done?" done":"")+'">'+chk("clean."+i+".done",c.done)+
         '<span class="txt">'+ed("clean."+i+".t",c.t)+'</span>'+del("clean",i)+'</li>';
    });
    h+='</ul><button class="btn" data-a="add-clean" data-f="'+g+'">+ Añadir</button>'+
       '<button class="mini" data-a="uncheck-clean" data-f="'+g+'">Desmarcar</button></div>';
  });
  h+='<h2>Batch cooking · sábado</h2><div class="card">';
  state.batch.forEach(function(b,i){
    h+='<div class="tagline"><span>'+ed("batch."+i+".t",b.t)+'</span>'+del("batch",i)+'</div>';
  });
  h+='<button class="btn" data-a="add" data-p="batch">+ Añadir</button></div>';

  h+='<h2>Avisos</h2><div class="card">';
  var perm = ("Notification" in window) ? Notification.permission : "no";
  if(perm==="no"){
    h+='<p class="hint" style="margin-top:0">Este navegador no admite avisos del sistema.</p>';
  }else{
    h+='<p class="estado est-'+perm+'">'+
       (perm==="granted" ? "Avisos activados en este móvil"
        : perm==="denied" ? "Avisos bloqueados — actívalos en los ajustes del navegador"
        : "Avisos sin activar")+'</p>';
    if(perm!=="granted") h+='<button class="mini" data-a="permiso">Activar avisos</button>';
    else h+='<button class="mini" data-a="probar">Probar un aviso</button>';
    h+='<p class="hint">Con esto te avisa cada cosa del horario a su hora, y a las '+HORA_RESUMEN+
       ' te llega lo que tienes mañana. <b>Solo mientras la app esté abierta</b>, aunque sea en '+
       'segundo plano: una web no puede despertarse sola.</p>';
  }
  h+='<div class="divisor"></div>'+
     '<p class="hint" style="margin-top:0"><b>Para que suene con la app cerrada</b>, pásalo al '+
     'calendario del móvil. Se crean alarmas que se repiten todos los días, y avisa el teléfono.</p>'+
     '<button class="mini" data-a="prog-horario">Horario diario al calendario</button>'+
     '<button class="mini" data-a="prog-resumen">Repaso de las '+HORA_RESUMEN+'</button>'+
     '</div>';

  h+='<h2>Datos</h2><div class="card">';
  if(!IS_ARTIFACT){
    h+='<button class="mini" data-a="export">Exportar</button>'+
       '<button class="mini" data-a="import">Importar</button>';
  }
  h+='<button class="mini" data-a="reset">Volver a la rutina original</button>'+
     '<p class="hint">'+(IS_ARTIFACT?"Se guarda solo.":
       "Se guarda en este móvil. Exporta de vez en cuando por si cambias de teléfono.")+'</p></div>';
  return h;
}

var TITLES={hoy:"Hoy",tareas:"Tareas",agenda:"Agenda",semana:"La semana",compra:"Compra",casa:"Casa"};
var SUBS={semana:"Toca cualquier texto para editarlo",compra:"Marca según vas cogiendo",
          casa:"Limpieza y batch cooking"};
function subTareas(){
  var n=state.todos.filter(function(t){return !t.done;}).length;
  return n===0?"Todo hecho":(n===1?"1 pendiente":n+" pendientes");
}
function subAgenda(){
  var hoy=isoDe(new Date());
  var n=agendaItems().filter(function(o){ return o.f>=hoy; }).length;
  return n===0?"Nada por delante":(n===1?"1 cosa por delante":n+" cosas por delante");
}
function render(){
  var d=state.days[todayIdx], i, b=document.querySelectorAll(".tabs button");
  document.body.setAttribute("data-view",view);
  document.getElementById("title").textContent = view==="hoy" ? d.n : TITLES[view];
  document.getElementById("sub").textContent = view==="hoy"
    ? new Date().toLocaleDateString("es-ES",{day:"numeric",month:"long"})
    : (view==="tareas" ? subTareas() : view==="agenda" ? subAgenda() : (SUBS[view]||""));
  document.getElementById("view").innerHTML =
    view==="hoy"?vHoy(): view==="tareas"?vTareas(): view==="agenda"?vAgenda():
    view==="semana"?vSemana(): view==="compra"?vCompra(): vCasa();
  for(i=0;i<b.length;i++) b[i].setAttribute("aria-pressed", b[i].getAttribute("data-v")===view?"true":"false");
}

/* ---------------- interacción ---------------- */
function findUp(el,attr){
  while(el && el!==document){
    if(el.getAttribute && el.getAttribute(attr)!==null) return el;
    el=el.parentNode;
  }
  return null;
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  var nav=findUp(t,"data-v");
  if(nav){ view=nav.getAttribute("data-v"); render(); window.scrollTo(0,0); return; }
  var b=findUp(t,"data-a");
  if(!b) return;
  var a=b.getAttribute("data-a"), p=b.getAttribute("data-p"), i=parseInt(b.getAttribute("data-i"),10);

  if(a==="tab"){ shopTab=i; render(); return; }
  if(a==="toggle"){ put(p,!get(p)); render(); save(); return; }
  if(a==="del"){ get(p).splice(i,1); render(); save(); return; }
  if(a==="add"){ get(p).push({t:""}); render(); save(); focusLast(p); return; }
  if(a==="add-act"){ state.days[todayIdx].acts.push({t:"",c:"rest"}); render(); save();
                     focusLast("days."+todayIdx+".acts"); return; }
  if(a==="add-today"){
    var fila={h:"08:00",t:""};
    state.today.push(fila); sortToday(); render(); save();
    focusSel('[data-p="today.'+state.today.indexOf(fila)+'.t"]'); return;
  }
  if(a==="add-clean"){ state.clean.push({t:"",f:b.getAttribute("data-f")}); render(); save();
                       focusSel('[data-p="clean.'+(state.clean.length-1)+'.t"]'); return; }
  if(a==="uncheck"){ get(p).forEach(function(x){x.done=false;}); render(); save(); return; }
  if(a==="uncheck-clean"){ var f=b.getAttribute("data-f");
    state.clean.forEach(function(c){ if(c.f===f) c.done=false; }); render(); save(); return; }

  if(a==="add-todo"){ addTodo(); return; }
  if(a==="clear-todos"){
    state.todos=state.todos.filter(function(x){ return !x.done; }); render(); save(); return; }
  if(a==="abrir-cuando"){
    var td=state.todos[i];
    td.o = td.o ? 0 : 1;
    if(td.o && !td.f){ td.f=isoDe(new Date()); td.h=td.h||"09:00"; }
    render(); save(); return;
  }
  if(a==="quitar-fecha"){
    var q=state.todos[i]; delete q.f; delete q.h; q.o=0; render(); save(); return;
  }
  if(a==="add-evento"){ addEvento(); return; }
  if(a==="clear-eventos"){
    var hoy=isoDe(new Date());
    state.eventos=state.eventos.filter(function(x){ return (x.f||"")>=hoy; });
    render(); save(); return;
  }

  if(a==="fin-dia"){
    if(!window.confirm("¿Cerrar el día?\n\nSe borra el horario actual y se deja la base de mañana: "+
       "desayunar 07:30, comer 14:30, cenar 20:00 y acostarse 22:30."))return;
    state.today=clone(BASE_DIA);
    state.finDia=isoDe(new Date());
    render(); save(); return;
  }
  if(a==="permiso"){ pedirPermiso(); return; }
  if(a==="probar"){ lanzar("Semana Base","Los avisos funcionan. Esto es una prueba."); return; }
  if(a==="prog-horario"){ programarHorario(); return; }
  if(a==="prog-resumen"){ programarResumen(); return; }
  if(a==="export"){ doExport(); return; }
  if(a==="import"){ document.getElementById("importer").click(); return; }
  if(a==="reset"){
    if(window.confirm("¿Volver a la rutina original? Se pierden tus cambios."))
      { state=clone(DEFAULTS); render(); save(); }
    return;
  }
},false);

function addTodo(){
  var inp=document.getElementById("nueva-tarea");
  if(!inp) return;
  var v=inp.value.replace(/\s+/g," ").trim();
  if(!v){ inp.focus(); return; }
  state.todos.unshift({t:v,done:false});
  inp.value=""; render(); save();
  var n=document.getElementById("nueva-tarea"); if(n) n.focus();
}
function addEvento(){
  var ti=document.getElementById("nuevo-evento");
  var fe=document.getElementById("nuevo-fecha");
  var ho=document.getElementById("nuevo-hora");
  if(!ti||!fe||!ho) return;
  var v=ti.value.replace(/\s+/g," ").trim();
  if(!v){ ti.focus(); return; }
  if(!fe.value){ fe.focus(); return; }
  state.eventos.push({t:v,f:fe.value,h:normHour(ho.value||"09:00")});
  ti.value=""; render(); save();
  var n=document.getElementById("nuevo-evento"); if(n) n.focus();
}
document.addEventListener("keydown",function(ev){
  var id=ev.target && ev.target.id;
  if(ev.key==="Enter" && id==="nueva-tarea"){ ev.preventDefault(); addTodo(); return; }
  if(ev.key==="Enter" && (id==="nuevo-evento"||id==="nuevo-fecha"||id==="nuevo-hora")){
    ev.preventDefault(); addEvento(); return;
  }
  if(ev.key==="Enter" && ev.target.classList && ev.target.classList.contains("ed")){
    ev.preventDefault(); ev.target.blur();
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  var p=el.getAttribute && el.getAttribute("data-p");
  if(!p) return;
  put(p, el.type==="time" ? normHour(el.value) : el.value);
  save(); render();
});

function focusLast(p){ focusSel('[data-p="'+p+"."+(get(p).length-1)+'.t"]'); }
function focusSel(s){
  var el=document.querySelector(s); if(!el) return;
  el.focus();
  try{
    var r=document.createRange(); r.selectNodeContents(el);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}
document.addEventListener("focusout",function(ev){
  var el=ev.target;
  if(!el.classList||!el.classList.contains("ed")) return;
  var p=el.getAttribute("data-p"), v=el.textContent.replace(/\s+/g," ").trim();
  var esHoy=/^today\.\d+\.h$/.test(p);
  var esHora=esHoy || /^(todos|eventos)\.\d+\.h$/.test(p);
  if(v===get(p) && !esHora) return;
  put(p, esHora ? normHour(v) : v);
  save();
  if(esHoy) sortToday();
  if(esHora) render();
});
document.addEventListener("paste",function(ev){
  if(!ev.target.classList||!ev.target.classList.contains("ed")) return;
  ev.preventDefault();
  var txt=(ev.clipboardData||window.clipboardData).getData("text/plain").replace(/\s+/g," ");
  document.execCommand("insertText",false,txt);
});

function doExport(){
  try{
    var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="semana-base.json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
  }catch(e){ window.alert("No se ha podido exportar en este navegador."); }
}
document.getElementById("importer").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=migrate(JSON.parse(rd.result));
      if(s){ state=s; render(); save(); } else window.alert("Ese archivo no vale.");
    }catch(e){ window.alert("Ese archivo no vale."); }
  };
  rd.readAsText(f);
  ev.target.value="";
});

/* ---------------- arranque ---------------- */
function migrate(s){
  if(!s||!s.days||!s.lists) return null;
  ["today","clean","batch","ideas","todos","eventos"].forEach(function(k){
    if(!s[k]) s[k]=clone(DEFAULTS[k]);
  });
  return s;
}
try{
  var raw=localStorage.getItem(LS_KEY);
  if(raw){ var s0=migrate(JSON.parse(raw)); if(s0) state=s0; }
}catch(e){}
render();
status("","");

if(navigator.serviceWorker && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
revisarAvisos();
setInterval(revisarAvisos, 30000);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){ revisarAvisos(); render(); }
});

if(IS_ARTIFACT){
  window.claude.use("db").then(function(db){
    if(!db) return;
    docRef=db.doc("plan/v1");
    return docRef.get().then(function(sn){
      if(sn.exists){
        var s=migrate(sn.data()&&sn.data().state);
        if(s){ state=s; render(); saveLocal(); }
      }else{ dirty=true; flush(); }
      status("ok","Guardado");
      docRef.onSnapshot(function(x){
        if(!x.exists||x.metadata.hasPendingWrites) return;
        var ae=document.activeElement;
        if(ae&&ae.classList&&ae.classList.contains("ed")) return;
        if(ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT")) return;
        var inc=x.data()&&x.data().state;
        if(!inc||JSON.stringify(inc)===JSON.stringify(state)) return;
        var s=migrate(clone(inc));
        if(s){ state=s; render(); saveLocal(); }
      },function(){});
    });
  }).catch(function(){});
}

})();
